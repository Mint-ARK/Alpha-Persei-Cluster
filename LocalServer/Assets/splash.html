    const EASE_BODY = "cubic-bezier(0.28, 0.11, 0.32, 1.0)";
    const EASE_FLICK = "cubic-bezier(0.22, 0.10, 0.25, 1.0)";
    const START_DELAY = 0.20;

    const svg = document.getElementById("brandSvg");
    const haloGroup = document.getElementById("haloGroup");
    const coreGroup = document.getElementById("coreGroup");
    const maskGroup = document.getElementById("maskGroup");
    const sheenGroup = document.getElementById("sheenGroup");
    const sheenRect = document.getElementById("sheenRect");
    const skipHint = document.getElementById("skipHint");

    let isCompleted = false;

    function notifyHostCompleted() {
      if (isCompleted) return;
      isCompleted = true;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage("splash_completed");
      }
    }

    // 交互逃生管道：支持按键与鼠标点击立即跳过
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" || e.key === " ") {
        notifyHostCompleted();
      }
    });
    window.addEventListener("click", () => {
      notifyHostCompleted();
    });

    // 1秒后展示极简跳过提示
    setTimeout(() => {
      if (!isCompleted) skipHint.classList.add("visible");
    }, 900);

    // 挂载笔画路径
    const haloPaths = [];
    const corePaths = [];

    STROKES.forEach((stroke) => {
      const dClean = stroke.d.replace(/\s+/g, " ").trim();
      const baseW = stroke.width ?? 0.42;

      // 1. 底栖光晕路径 (双层辉光底质)
      const halo = document.createElementNS("http://www.w3.org/2000/svg", "path");
      halo.setAttribute("d", dClean);
      halo.setAttribute("pathLength", "1");
      halo.setAttribute("stroke", "#00f2fe");
      halo.setAttribute("stroke-width", baseW * 2.4);
      halo.setAttribute("stroke-linecap", "round");
      halo.setAttribute("stroke-linejoin", "round");
      halo.setAttribute("stroke-dasharray", "1 2");
      halo.setAttribute("stroke-dashoffset", "1");
      halo.style.opacity = "0";
      haloGroup.appendChild(halo);
      haloPaths.push(halo);

      // 2. 核心骨干路径
      const core = document.createElementNS("http://www.w3.org/2000/svg", "path");
      core.setAttribute("d", dClean);
      core.setAttribute("pathLength", "1");
      core.setAttribute("stroke", "#ffffff");
      core.setAttribute("stroke-width", baseW);
      core.setAttribute("stroke-linecap", "round");
      core.setAttribute("stroke-linejoin", "round");
      core.setAttribute("stroke-dasharray", "1 2");
      core.setAttribute("stroke-dashoffset", "1");
      core.style.opacity = "0";
      coreGroup.appendChild(core);
      corePaths.push(core);

      // 3. 蒙版拓扑白模
      const maskPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
      maskPath.setAttribute("d", dClean);
      maskPath.setAttribute("stroke", "#ffffff");
      maskPath.setAttribute("stroke-width", baseW * 1.35);
      maskPath.setAttribute("stroke-linecap", "round");
      maskPath.setAttribute("stroke-linejoin", "round");
      maskGroup.appendChild(maskPath);
    });

    // 动力学时长计算函数 (次线性幂律模型 T = 0.032 * L^0.68)
    function calcDuration(length) {
      return Math.max(0.032 * Math.pow(length, 0.68), 0.065);
    }

    // 笔势交融连带率 (32% 重叠，上限 120ms)
    function calcOverlap(duration) {
      return Math.min(duration * 0.32, 0.12);
    }

    // 运笔编排流水线
    let t = START_DELAY;

    corePaths.forEach((path, i) => {
      const length = path.getTotalLength();
      const duration = calcDuration(length);
      const easing = length < 8.0 ? EASE_FLICK : EASE_BODY;

      // 底层光晕渲染
      haloPaths[i].animate(
        [
          { strokeDashoffset: 1, opacity: 0.38 },
          { strokeDashoffset: 0, opacity: 0.38 }
        ],
        {
          duration: duration * 1000,
          delay: t * 1000,
          easing: easing,
          fill: "forwards"
        }
      );

      // 核心骨架书写
      path.animate(
        [
          { strokeDashoffset: 1, opacity: 1 },
          { strokeDashoffset: 0, opacity: 1 }
        ],
        {
          duration: duration * 1000,
          delay: t * 1000,
          easing: easing,
          fill: "forwards"
        }
      );

      const stroke = STROKES[i];
      const pause = stroke.pauseAfter ?? 0;
      const isLast = i === corePaths.length - 1;
      const overlap = isLast ? 0 : calcOverlap(duration);
      t += duration - overlap + pause;
    });

    // 配置高光横掠光束宽度与轨迹 (基于 viewBox 2.5 10.0 85.0 20.0)
    const vbX = 2.5;
    const vbW = 85.0;
    const beamW = vbW * 0.28; // ~23.8
    sheenRect.setAttribute("width", beamW);
    sheenRect.setAttribute("x", vbX - beamW - 2);

    // 书写完毕时刻：触发高光掠过特效 (850ms)
    sheenGroup.animate(
      [
        { opacity: 0 },
        { opacity: 0.95, offset: 0.15 },
        { opacity: 0.95, offset: 0.85 },
        { opacity: 0, offset: 1.0 }
      ],
      {
        delay: t * 1000,
        duration: 850,
        easing: "ease-in-out",
        fill: "forwards"
      }
    );

    sheenRect.animate(
      [
        { transform: "translateX(0px)" },
        { transform: `translateX(${vbW + beamW + 8}px)` }
      ],
      {
        delay: t * 1000,
        duration: 850,
        easing: "cubic-bezier(0.22, 1, 0.36, 1)",
        fill: "forwards"
      }
    );

    // 终章辉光绽放呼吸 (750ms)
    svg.animate(
      [
        { filter: "drop-shadow(0 0 3px rgba(255, 255, 255, 0.45)) drop-shadow(0 0 16px rgba(0, 242, 254, 0.45))", transform: "scale(1)" },
        { filter: "drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)) drop-shadow(0 0 28px rgba(0, 242, 254, 0.85))", transform: "scale(1.012)" },
        { filter: "drop-shadow(0 0 3px rgba(255, 255, 255, 0.45)) drop-shadow(0 0 16px rgba(0, 242, 254, 0.45))", transform: "scale(1)" }
      ],
      {
        delay: (t + 0.12) * 1000,
        duration: 750,
        easing: "cubic-bezier(0.25, 0.1, 0.25, 1)",
        fill: "none"
      }
    );

    // 完整动画结束：通知 C# 宿主开始渐隐消隐
    const totalTimeMs = (t + 0.95) * 1000;
    setTimeout(() => {
      notifyHostCompleted();
    }, totalTimeMs);
  </script>
