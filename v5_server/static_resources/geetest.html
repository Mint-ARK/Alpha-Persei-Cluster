</style>

<body>


  <!-- <script>
    if (!window.unityPostMessage) {
      window.unityPostMessage = console.log
    }
  </script> -->

  <script>
    var getUrlQueryParams = function (url) {
      var params = {};
      var arr = url.split('?');
      if (arr.length <= 1) {
        return params;
      }
      arr = arr[1].split('&');
      for (var i = 0; i < arr.length; i++) {
        var data = arr[i].split('=');
        params[data[0]] = data[1];
      }
      return params;
    };

    var params = getUrlQueryParams(window.location.href);

    if (!params.captchaId || !params.challenge) {
      console.error('缺少参数 captchaId 或 challenge')
    } else {
      initGeetest({
        // 以下配置参数来自服务端 SDK
        gt: params.captchaId,
        challenge: params.challenge,
        offline: !(params.success == 'true'),
        new_captcha: true,
        product: 'bind',
        lang: params.lang || 'zh-cn',
      }, function (captchaObj) {
        // 这里可以调用验证实例 captchaObj 的实例方法

        captchaObj
          .onReady(() => {
            captchaObj.verify()
            console.log('onReady')
          })
          .onClose(() => {
            console.log('closeVerifyModal')
            unityPostMessageClose()
          })
          .onSuccess(() => {
            let result = captchaObj.getValidate()
            console.log('onSuccess', result)
            unityPostMessage(result)
          })
          .onError((error) => {
            unityPostMessage(error)
          })
      })
    }
  </script>
</body>

</html>
